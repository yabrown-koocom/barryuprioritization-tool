<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cabinet Investment Prioritization — Live Scoring</title>
<style>
  :root {
    --red: #8B1A1A;
    --teal: #0F766E;
    --green: #059669;
    --purple: #7C3AED;
    --slate: #475569;
    --light: #94A3B8;
    --bg-fund: #ECFDF5;
    --bg-build: #F5F3FF;
    --bg-sustain: #F1F5F9;
    --bg-future: #F8FAFC;
    --border: #E5E7EB;
    --text: #1F2937;
    --muted: #475569;
    --input-bg: #FFFCE6;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    margin: 0; padding: 16px;
    background: #FFFFFF;
    color: var(--text);
    font-size: 13px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; }
  .subtitle { color: var(--muted); font-style: italic; font-size: 12px; margin: 0 0 16px; }
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 18px;
  }
  .panel {
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
  }
  .panel h2 {
    font-size: 13px; font-weight: 700; color: var(--muted);
    letter-spacing: 1.5px; margin: 0 0 12px; text-transform: uppercase;
  }
  /* Weights bar */
  .weights {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    margin-bottom: 12px; padding: 10px 14px;
    background: #F8FAFC; border-radius: 8px; border: 1px solid var(--border);
  }
  .weights label { font-weight: 600; color: var(--muted); font-size: 12px; }
  .weights input[type="range"] { flex: 1; min-width: 200px; }
  .weights .pill {
    background: #FFFFFF; border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 12px; font-weight: 700; font-size: 12px;
  }
  .pill.green { color: var(--green); }
  .pill.purple { color: var(--purple); }
  /* Summary chips */
  .summary { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .chip {
    padding: 8px 12px; border-radius: 8px; font-weight: 600;
    font-size: 12px; display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--border);
  }
  .chip .count {
    font-size: 16px; font-weight: 700; padding: 2px 8px;
    background: #FFFFFF; border-radius: 4px;
  }
  .chip.fund { background: var(--bg-fund); color: var(--green); }
  .chip.build { background: var(--bg-build); color: var(--purple); }
  .chip.sustain { background: var(--bg-sustain); color: var(--slate); }
  .chip.future { background: var(--bg-future); color: var(--light); }
  /* Items table */
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 5px 6px; border-bottom: 1px solid var(--border); text-align: left; }
  th {
    background: var(--text); color: #FFFFFF;
    font-weight: 600; font-size: 10px; letter-spacing: 1px;
    text-transform: uppercase; position: sticky; top: 0;
  }
  td.score { text-align: center; }
  td.computed { font-weight: 700; text-align: center; background: #F8FAFC; }
  .item-input {
    border: none; background: transparent; width: 100%;
    font-family: inherit; font-size: 12px; color: var(--text);
  }
  .item-input:focus { outline: 2px solid var(--green); background: #FFFFFF; }
  .score-input {
    width: 44px; border: 1px solid var(--border); border-radius: 4px;
    background: var(--input-bg); padding: 4px;
    text-align: center; font-family: inherit; font-size: 12px; font-weight: 600;
  }
  .score-input:focus { outline: 2px solid var(--green); }
  .quad-tag {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
  }
  .quad-tag.fund { background: var(--bg-fund); color: var(--green); }
  .quad-tag.build { background: var(--bg-build); color: var(--purple); }
  .quad-tag.sustain { background: var(--bg-sustain); color: var(--slate); }
  .quad-tag.future { background: var(--bg-future); color: var(--light); }
  .row-delete {
    background: transparent; border: none; color: var(--light);
    cursor: pointer; font-size: 14px; padding: 0 4px;
  }
  .row-delete:hover { color: var(--red); }
  /* Buttons */
  .toolbar { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button.action {
    background: var(--text); color: #FFFFFF; border: none;
    padding: 8px 16px; border-radius: 6px;
    font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  button.action:hover { background: #000000; }
  button.action.secondary {
    background: #FFFFFF; color: var(--text); border: 1px solid var(--border);
  }
  button.action.secondary:hover { background: #F8FAFC; }
  /* Chart */
  #chart-wrap { position: sticky; top: 0; }
  svg.chart { width: 100%; height: auto; display: block; }
  .table-scroll { max-height: 70vh; overflow-y: auto; }
  /* Top 5 */
  .top5 { margin-top: 14px; }
  .top5 ol { margin: 0; padding-left: 22px; }
  .top5 li { padding: 4px 0; }
  .top5 .item-name { font-weight: 600; }
  .top5 .y-val { color: var(--muted); font-size: 11px; margin-left: 6px; }
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<h1>Cabinet Investment Prioritization — Live Scoring</h1>
<p class="subtitle">Edit scores 1–5. Quadrant placement updates automatically. Mission alignment is a precondition (not scored).</p>

<div class="weights">
  <label>Revenue weight</label>
  <span class="pill green" id="wRevDisplay">50%</span>
  <input type="range" id="wRev" min="0" max="100" value="50">
  <span class="pill purple" id="wOutDisplay">50%</span>
  <label>Outcomes weight</label>
</div>

<div class="summary" id="summary"></div>

<div class="layout">
  <div class="panel">
    <h2>Items &amp; Scores</h2>
    <div class="table-scroll">
      <table id="itemsTable">
        <thead>
          <tr>
            <th>Item</th>
            <th>Rev</th>
            <th>Out</th>
            <th>Time</th>
            <th>Feas</th>
            <th>Y</th>
            <th>Quadrant</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
      </table>
    </div>
    <div class="toolbar">
      <button class="action" id="addItemBtn">+ Add Item</button>
      <button class="action secondary" id="exportBtn">Export CSV</button>
      <button class="action secondary" id="resetBtn">Reset Scores</button>
    </div>
  </div>

  <div class="panel" id="chart-wrap">
    <h2>Strategic Impact × Time-Criticality</h2>
    <svg class="chart" viewBox="0 0 600 540" id="chart"></svg>
    <div class="top5" id="top5"></div>
  </div>
</div>

<script>
// ---------- Data ----------
const SEED = [
  { name: "CASA UG Expansion + grad / adult success coaching", rev: 3, out: 5, time: 3, feas: 4 },
  { name: "Dedicated admin support for graduate programs", rev: 2, out: 4, time: 4, feas: 4 },
  { name: "Athlete / Non-Athlete Experience Integration", rev: 2, out: 3, time: 2, feas: 3 },
  { name: "Strategic Tech — Ontology / S2C / Agentic", rev: 3, out: 4, time: 4, feas: 3 },
  { name: "Physician Assistant (PA) program", rev: 5, out: 4, time: 5, feas: 3 },
  { name: "MSN / BSN Rightsizing and Growth", rev: 5, out: 4, time: 4, feas: 4 },
  { name: "Biomedical Sciences (BMS) — POD Feeder", rev: 4, out: 4, time: 5, feas: 4 },
  { name: "EMT program", rev: 3, out: 3, time: 3, feas: 4 },
  { name: "Healthcare MBA", rev: 4, out: 3, time: 4, feas: 4 },
  { name: "Pharmacy Tech programs", rev: 3, out: 3, time: 3, feas: 4 },
  { name: "Workforce Offerings — CE", rev: 4, out: 4, time: 4, feas: 3 },
  { name: "AI-Resistant Offerings", rev: 3, out: 4, time: 3, feas: 2 },
  { name: "Enrollment-Driven Marketing Investments", rev: 4, out: 3, time: 5, feas: 4 },
  { name: "Barry Online — Growth Engine", rev: 5, out: 4, time: 5, feas: 3 },
  { name: "Online learner success model", rev: 3, out: 5, time: 4, feas: 4 },
  { name: "Instructional design + faculty model", rev: 3, out: 4, time: 4, feas: 4 },
  { name: "Dedicated online marketing allocation", rev: 4, out: 3, time: 4, feas: 4 },
  { name: "SIS Replacement", rev: 2, out: 3, time: 5, feas: 3 },
  { name: "Forms imaging", rev: 1, out: 2, time: 3, feas: 5 },
  { name: "International student processing", rev: 3, out: 3, time: 4, feas: 4 },
  { name: "Master Plan", rev: 2, out: 2, time: 2, feas: 2 },
  { name: "Library renovation", rev: 2, out: 3, time: 2, feas: 3 },
  { name: "Campus beautification", rev: 1, out: 1, time: 1, feas: 4 },
  { name: "Parking", rev: 1, out: 2, time: 2, feas: 3 },
  { name: "Relocations & Moves", rev: 1, out: 1, time: 3, feas: 4 },
  { name: "Housing Feasibility Study", rev: 2, out: 2, time: 2, feas: 4 },
  { name: "UG & GR Housing", rev: 3, out: 3, time: 2, feas: 2 },
  { name: "Athletics Expansion — Lacrosse", rev: 2, out: 3, time: 2, feas: 3 },
];
const BOUNDARY = 3.0;
let items = JSON.parse(JSON.stringify(SEED));
let wRev = 50;

// ---------- Helpers ----------
function computeY(it) {
  const wOut = 100 - wRev;
  return (it.rev * wRev + it.out * wOut) / (wRev + wOut);
}
function quadrant(it) {
  const y = computeY(it);
  if (y >= BOUNDARY && it.time >= BOUNDARY) return "Fund Now";
  if (y >= BOUNDARY && it.time < BOUNDARY) return "Build Toward";
  if (y < BOUNDARY && it.time >= BOUNDARY) return "Sustain";
  return "Future Phase";
}
const QUAD_STYLE = {
  "Fund Now":    { color: "#059669", bg: "#ECFDF5", className: "fund" },
  "Build Toward":{ color: "#7C3AED", bg: "#F5F3FF", className: "build" },
  "Sustain":     { color: "#475569", bg: "#F1F5F9", className: "sustain" },
  "Future Phase":{ color: "#94A3B8", bg: "#F8FAFC", className: "future" },
};

// ---------- Render: Weights ----------
function renderWeights() {
  document.getElementById("wRevDisplay").textContent = `${wRev}%`;
  document.getElementById("wOutDisplay").textContent = `${100 - wRev}%`;
}

// ---------- Render: Summary ----------
function renderSummary() {
  const counts = { "Fund Now": 0, "Build Toward": 0, "Sustain": 0, "Future Phase": 0 };
  items.forEach(it => counts[quadrant(it)]++);
  const el = document.getElementById("summary");
  el.innerHTML = "";
  for (const q of ["Fund Now", "Build Toward", "Sustain", "Future Phase"]) {
    const div = document.createElement("div");
    div.className = "chip " + QUAD_STYLE[q].className;
    div.innerHTML = `<span>${q}</span><span class="count">${counts[q]}</span>`;
    el.appendChild(div);
  }
}

// ---------- Render: Items Table ----------
function renderTable() {
  const tbody = document.getElementById("itemsBody");
  tbody.innerHTML = "";
  items.forEach((it, idx) => {
    const tr = document.createElement("tr");
    const y = computeY(it);
    const q = quadrant(it);
    const qStyle = QUAD_STYLE[q];

    tr.innerHTML = `
      <td><input class="item-input" data-idx="${idx}" data-field="name" value="${escapeHtml(it.name)}"></td>
      <td class="score"><input class="score-input" type="number" min="1" max="5" data-idx="${idx}" data-field="rev" value="${it.rev}"></td>
      <td class="score"><input class="score-input" type="number" min="1" max="5" data-idx="${idx}" data-field="out" value="${it.out}"></td>
      <td class="score"><input class="score-input" type="number" min="1" max="5" data-idx="${idx}" data-field="time" value="${it.time}"></td>
      <td class="score"><input class="score-input" type="number" min="1" max="5" data-idx="${idx}" data-field="feas" value="${it.feas}"></td>
      <td class="computed">${y.toFixed(2)}</td>
      <td><span class="quad-tag ${qStyle.className}">${q}</span></td>
      <td><button class="row-delete" data-del-idx="${idx}" title="Delete">✕</button></td>
    `;
    tbody.appendChild(tr);
  });

  // Wire up input changes
  tbody.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", (e) => {
      const i = +e.target.dataset.idx;
      const f = e.target.dataset.field;
      if (f === "name") items[i].name = e.target.value;
      else items[i][f] = Math.max(1, Math.min(5, +e.target.value || 1));
      renderAll();
    });
  });
  tbody.querySelectorAll(".row-delete").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const i = +e.target.dataset.delIdx;
      items.splice(i, 1);
      renderAll();
    });
  });
}

// ---------- Render: Chart ----------
function renderChart() {
  const svg = document.getElementById("chart");
  const W = 600, H = 540;
  const padL = 60, padR = 30, padT = 30, padB = 60;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const minV = 0, maxV = 5;
  function sx(v) { return padL + (v - minV) / (maxV - minV) * innerW; }
  function sy(v) { return padT + innerH - (v - minV) / (maxV - minV) * innerH; }
  const bX = sx(BOUNDARY), bY = sy(BOUNDARY);

  let html = "";

  // Quadrant background tints
  html += `<rect x="${padL}" y="${padT}" width="${bX - padL}" height="${bY - padT}" fill="${QUAD_STYLE["Build Toward"].bg}"/>`;
  html += `<rect x="${bX}" y="${padT}" width="${padL + innerW - bX}" height="${bY - padT}" fill="${QUAD_STYLE["Fund Now"].bg}"/>`;
  html += `<rect x="${padL}" y="${bY}" width="${bX - padL}" height="${padT + innerH - bY}" fill="${QUAD_STYLE["Future Phase"].bg}"/>`;
  html += `<rect x="${bX}" y="${bY}" width="${padL + innerW - bX}" height="${padT + innerH - bY}" fill="${QUAD_STYLE["Sustain"].bg}"/>`;

  // Quadrant labels
  html += `<text x="${(padL + bX) / 2}" y="${padT + 18}" font-size="11" font-weight="700" fill="${QUAD_STYLE["Build Toward"].color}" text-anchor="middle" letter-spacing="1">BUILD TOWARD</text>`;
  html += `<text x="${(bX + padL + innerW) / 2}" y="${padT + 18}" font-size="11" font-weight="700" fill="${QUAD_STYLE["Fund Now"].color}" text-anchor="middle" letter-spacing="1">FUND NOW</text>`;
  html += `<text x="${(padL + bX) / 2}" y="${padT + innerH + 50}" font-size="11" font-weight="700" fill="${QUAD_STYLE["Future Phase"].color}" text-anchor="middle" letter-spacing="1">FUTURE PHASE</text>`;
  html += `<text x="${(bX + padL + innerW) / 2}" y="${padT + innerH + 50}" font-size="11" font-weight="700" fill="${QUAD_STYLE["Sustain"].color}" text-anchor="middle" letter-spacing="1">SUSTAIN</text>`;

  // Boundary lines
  html += `<line x1="${bX}" y1="${padT}" x2="${bX}" y2="${padT + innerH}" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4"/>`;
  html += `<line x1="${padL}" y1="${bY}" x2="${padL + innerW}" y2="${bY}" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4"/>`;

  // Axes
  html += `<line x1="${padL}" y1="${padT + innerH}" x2="${padL + innerW}" y2="${padT + innerH}" stroke="#1F2937" stroke-width="1.5"/>`;
  html += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + innerH}" stroke="#1F2937" stroke-width="1.5"/>`;

  // Axis ticks
  for (let i = 0; i <= 5; i++) {
    const x = sx(i), y = sy(i);
    html += `<text x="${x}" y="${padT + innerH + 16}" font-size="10" fill="#475569" text-anchor="middle">${i}</text>`;
    html += `<text x="${padL - 8}" y="${y + 4}" font-size="10" fill="#475569" text-anchor="end">${i}</text>`;
  }
  html += `<text x="${padL + innerW / 2}" y="${padT + innerH + 36}" font-size="12" font-weight="700" fill="#1F2937" text-anchor="middle">Time-Criticality →</text>`;
  html += `<text x="${20}" y="${padT + innerH / 2}" font-size="12" font-weight="700" fill="#1F2937" text-anchor="middle" transform="rotate(-90, 20, ${padT + innerH / 2})">Strategic Impact →</text>`;

  // Group items by exact (x,y) to apply jitter offset for overlapping dots
  const positions = {};
  items.forEach(it => {
    const y = computeY(it);
    const key = `${it.time}_${y.toFixed(2)}`;
    if (!positions[key]) positions[key] = [];
    positions[key].push(it);
  });

  // Plot dots with jitter for overlaps
  Object.values(positions).forEach(group => {
    const n = group.length;
    group.forEach((it, i) => {
      const y = computeY(it);
      const q = quadrant(it);
      const style = QUAD_STYLE[q];
      // Jitter: if multiple items at same coord, fan them in a tight cluster
      let dx = 0, dy = 0;
      if (n > 1) {
        const angle = (i / n) * 2 * Math.PI;
        const r = 9;
        dx = Math.cos(angle) * r;
        dy = Math.sin(angle) * r;
      }
      const cx = sx(it.time) + dx;
      const cy = sy(y) + dy;
      html += `<circle cx="${cx}" cy="${cy}" r="6" fill="${style.color}" stroke="white" stroke-width="1.5"><title>${escapeHtml(it.name)} (Y=${y.toFixed(2)}, X=${it.time})</title></circle>`;
    });
  });

  svg.innerHTML = html;
}

// ---------- Render: Top 5 ----------
function renderTop5() {
  const ranked = items.map((it, idx) => ({
    ...it,
    y: computeY(it),
    q: quadrant(it),
    tieBreak: computeY(it) - idx * 0.00001,
  })).sort((a, b) => b.tieBreak - a.tieBreak).slice(0, 5);

  const el = document.getElementById("top5");
  el.innerHTML = `
    <h2 style="margin-top:8px;">Top 5 by Strategic Impact</h2>
    <ol>
      ${ranked.map(r => `<li><span class="item-name">${escapeHtml(r.name)}</span><span class="y-val">Y=${r.y.toFixed(2)} · <span class="quad-tag ${QUAD_STYLE[r.q].className}">${r.q}</span></span></li>`).join("")}
    </ol>
  `;
}

// ---------- Render: All ----------
function renderAll() {
  renderWeights();
  renderSummary();
  renderTable();
  renderChart();
  renderTop5();
}

// ---------- Util ----------
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}

// ---------- Events ----------
document.getElementById("wRev").addEventListener("input", (e) => {
  wRev = +e.target.value;
  renderAll();
});
document.getElementById("addItemBtn").addEventListener("click", () => {
  items.push({ name: "New item", rev: 3, out: 3, time: 3, feas: 3 });
  renderAll();
});
document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("Reset all items and scores to the original list?")) {
    items = JSON.parse(JSON.stringify(SEED));
    wRev = 50;
    document.getElementById("wRev").value = 50;
    renderAll();
  }
});
document.getElementById("exportBtn").addEventListener("click", () => {
  const header = "Item,Revenue,Outcomes,Time-Criticality,Feasibility,Strategic Impact (Y),Quadrant\n";
  const rows = items.map(it => {
    const y = computeY(it);
    const q = quadrant(it);
    return `"${it.name.replace(/"/g, '""')}",${it.rev},${it.out},${it.time},${it.feas},${y.toFixed(2)},${q}`;
  }).join("\n");
  const csv = header + rows;
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Prioritization_Scores.csv";
  a.click();
});

// ---------- Init ----------
renderAll();
</script>

</body>
</html>
